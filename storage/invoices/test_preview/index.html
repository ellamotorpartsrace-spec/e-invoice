    <script>
        const statusEl = document.getElementById('loadingStatus');
        const singleContainer = document.getElementById('singleContainer');
        const galleryContainer = document.getElementById('galleryContainer');
        const mainCanvas = document.getElementById('mainCanvas');
        const mainCtx = mainCanvas.getContext('2d');
        const downloadLink = document.getElementById('downloadDirectLink');

        function renderPageToCanvas(pdfUrl, targetCanvas, scale = 2.0) {
            return pdfjsLib.getDocument(pdfUrl).promise.then(pdf => {
                return pdf.getPage(1);
            }).then(page => {
                const viewport = page.getViewport({ scale: scale });
                targetCanvas.height = viewport.height;
                targetCanvas.width = viewport.width;
                const renderContext = {
                    canvasContext: targetCanvas.getContext('2d'),
                    viewport: viewport
                };
                return page.render(renderContext).promise;
            });
        }

        function showSingle(file, btn) {
            document.querySelectorAll('#previewTabs .nav-link').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');

            singleContainer.style.display = 'block';
            galleryContainer.style.display = 'none';
            statusEl.style.display = 'block';
            statusEl.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i>Rendering ' + file + '...';
            downloadLink.href = file;

            renderPageToCanvas(file, mainCanvas, 2.0).then(() => {
                statusEl.style.display = 'none';
            }).catch(err => {
                statusEl.innerHTML = '<span class="text-danger">' + err.message + '</span>';
            });
        }

        function showGallery(btn) {
            document.querySelectorAll('#previewTabs .nav-link').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');

            singleContainer.style.display = 'none';
            galleryContainer.style.display = 'flex';
            statusEl.style.display = 'block';
            statusEl.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i>Rendering all platform themes...';

            Promise.all([
                renderPageToCanvas('shopee_preview.pdf', document.getElementById('canvasShopee'), 1.4),
                renderPageToCanvas('lazada_preview.pdf', document.getElementById('canvasLazada'), 1.4),
                renderPageToCanvas('tiktok_shop_preview.pdf', document.getElementById('canvasTikTok'), 1.4)
            ]).then(() => {
                statusEl.style.display = 'none';
            }).catch(err => {
                statusEl.innerHTML = '<span class="text-danger">' + err.message + '</span>';
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            showSingle('shopee_user_order_reproduction.pdf');
        });
    </script>
